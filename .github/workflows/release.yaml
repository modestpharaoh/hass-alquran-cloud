name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / code (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci

      - name: Run unit tests
        run: pytest tests/

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: "integration"

  release:
    name: Publish Release & Tag
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version and Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          else
            RAW="${{ github.ref_name }}"
            IS_PRERELEASE="false"
          fi

          VERSION="${RAW#v}"
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json version
        id: manifest
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          MANIFEST="custom_components/alquran_cloud/manifest.json"
          python - "$VERSION" "$MANIFEST" <<'PY'
          import re
          import sys
          from pathlib import Path

          version, path = sys.argv[1], Path(sys.argv[2])
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Unsupported version: {version}")
          text = path.read_text()
          updated, count = re.subn(
              r'("version"\s*:\s*")[^"]*(")',
              rf"\g<1>{version}\2",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("manifest.json has no version field")
          if updated != text:
              path.write_text(updated)
          PY
          if ! git diff --quiet "$MANIFEST"; then
            echo "manifest_changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$MANIFEST"
            git commit -m "chore(release): bump version to ${VERSION}"
            git push origin HEAD:main
          else
            echo "manifest_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push Git Tag
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          git fetch origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
          fi

      - name: Package Integration Zip
        run: |
          cd custom_components
          zip -r ../alquran_cloud.zip alquran_cloud
          cd ..

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          PRERELEASE="${{ steps.vars.outputs.prerelease }}"
          OPTS=()
          if [ "$PRERELEASE" = "true" ]; then
            OPTS+=("--prerelease")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" alquran_cloud.zip --clobber
          else
            gh release create "$TAG" alquran_cloud.zip \
              --title "Release ${TAG}" \
              --generate-notes \
              "${OPTS[@]}"
          fi
